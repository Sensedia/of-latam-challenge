spring:
  application:
    name: chile-registry-service

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:chiledb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  
  # H2 Console Configuration
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
        trace: false

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false

# Server Configuration
server:
  port: 8080

# Logging Configuration
logging:
  level:
    com.sensedia.openfinance: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO